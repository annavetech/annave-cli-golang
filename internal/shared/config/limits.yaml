# tend: Per-Module Operational Limits
#
# These values are embedded at build time.
# To change a limit: edit this file, then rebuild with go build ./cmd/tend.
# There is no runtime config file, so a binary behaves identically on every machine.

log:
  # Maximum number of lines read from a log file or stdin.
  # Reading stops at this limit; later lines are not analyzed.
  #
  # What breaks with wrong values:
  #   Too low:   log files with many INFO lines may truncate before reaching errors.
  #   Too high:  very large line counts increase analysis time proportionally.
  #
  # Reference: 1,000,000 lines at ~150 bytes/line ≈ 150 MB of log data.
  max_lines: 1000000

health:
  # Maximum per-target timeout in seconds.
  # If --timeout exceeds this value, it is clamped to this limit.
  #
  # What breaks with wrong values:
  #   Too low:   services with high cold-start latency (Lambda, Fargate) time out
  #              even when healthy. A Fargate cold start can take 5 to 8 seconds.
  #   Too high:  a slow or hung target holds the check open for the full duration,
  #              blocking the result when many targets are checked in parallel.
  #
  # Common values (seconds):
  #   5      (fast internal services)
  #   10     (default: covers most HTTP services with reasonable latency)
  #   30     (services behind a load balancer or with cold-start delays)
  timeout_seconds: 10

  # Maximum number of targets checked at the same time.
  # Every target is checked; targets beyond this number wait for a free slot.
  #
  # What breaks with wrong values:
  #   Too low:   long target lists take longer, because fewer checks run in parallel.
  #   Too high:  a very large target list opens that many connections at once.
  max_targets: 50

doc:
  # Maximum file size indexed, in megabytes.
  # Files larger than this are skipped during index build.
  #
  # What breaks with wrong values:
  #   Too low:   generated API references, large YAML specs, or bundled changelogs
  #              are skipped and never returned in search results.
  #   Too high:  very large files slow down indexing and increase peak memory.
  max_file_size_mb: 10

  # Maximum number of search results returned.
  max_results: 50

  # Maximum directory depth walked during index build.
  # Directories nested deeper than this are skipped.
  #
  # What breaks with wrong values:
  #   Too low:   deeply nested docs (e.g. monorepos with packages/*/docs/**) are missed.
  #   Too high:  has no real cost in a typical docs tree; only matters if symlink loops exist.
  #
  # Depth > 10 almost always indicates a structural issue in the documentation tree.
  max_depth: 10

cleanup:
  # Context deadline for the entire cluster scan, in seconds.
  # If the cluster API is slow, this may need to be increased.
  #
  # What breaks with wrong values:
  #   Too low:   scans on large clusters time out before all namespaces are listed.
  #              Each resource type (pods, pvcs, configmaps, namespaces) requires one API call.
  #   Too high:  a hung or unreachable cluster API holds the command open for the full duration.
  #
  # Common values (seconds):
  #   15     (small clusters, fast API)
  #   30     (default: covers most clusters with <100 namespaces)
  #   120    (large clusters with many namespaces or slow API server)
  timeout_seconds: 30

  # Total idle resources returned across all resource types.
  # Resources beyond this cap are silently dropped.
  #
  # What breaks with wrong values:
  #   Too low:   large clusters with significant waste have results silently truncated.
  #   Too high:  no practical downside; just increases output size.
  #
  # More than 1,000 idle resources almost always indicates a hygiene problem
  # that should be addressed before increasing this limit further.
  max_resources: 1000
