apiVersion: v1
kind: Pod
metadata:
  name: debug
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      securityContext:
        privileged: true
      resources:
        limits:
          cpu: 100m
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        runAsNonRoot: true
      resources:
        limits:
          cpu: 100m
      readinessProbe:
        httpGet:
          path: /
          port: 80
  ephemeralContainers:
    - name: shell
      image: busybox:1.36
      securityContext:
        privileged: true
